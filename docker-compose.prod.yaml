# ==============================================================================
# Stack en modo PRODUCCION (opcional).
#
#   docker compose -f docker-compose.prod.yaml up -d --build
#
# Diferencias con el stack de desarrollo (docker-compose.yaml):
#
#   - Las imagenes se construyen con el target `production` de cada Dockerfile
#     multi-stage: solo dependencias de runtime y el codigo ya compilado.
#     Sin tsc en watch -> mucho menos RAM (~60-90 MB por servicio en vez de
#     ~350-460 MB) y sin hot-reload.
#   - No se monta ./src: la imagen lleva el codigo compilado.
#   - Las imagenes de PRODUCCION no llevan el CLI de Prisma (es devDependency):
#     las migraciones y el seed se aplican con ./scripts/migrate.sh, que usa la
#     imagen de desarrollo como herramienta.
#   - Comparte los volumenes de datos con el stack de desarrollo, asi que las
#     bases ya migradas se reutilizan tal cual.
#
# OJO: los dos stacks usan los mismos container_name y puertos, asi que NO
# pueden correr al mismo tiempo. Pará el de desarrollo antes de levantar este.
# ==============================================================================

name: nest-microservices-prod

services:
  # ---------------------------------------------------------------------------
  # NATS: broker de mensajes. Todos los microservicios se comunican por aca.
  # ---------------------------------------------------------------------------
  nats:
    image: nats:2.10-alpine

    container_name: nats-server

    restart: unless-stopped

    # -js       -> habilita JetStream (persistencia de mensajes en disco)
    # -sd /data -> directorio del store de JetStream (en el volumen)
    # -m 8222   -> endpoint de monitoring HTTP (se usa como healthcheck)
    command: ["-js", "-sd", "/data", "-m", "8222"]

    ports: ["4222:4222", "8222:8222"]

    volumes: ["nats-data:/data"]

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # PostgreSQL: base de datos del microservicio de ordenes.
  # ---------------------------------------------------------------------------
  orders-db:
    image: postgres:16.2

    container_name: orders_database

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: ordersdb

    volumes: ["orders-db-data:/var/lib/postgresql/data"]

    ports: ["5432:5432"]

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ordersdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Microservicio de ordenes (NATS). No expone HTTP: por eso no tiene `ports`.
  # ---------------------------------------------------------------------------
  orders-ms:
    # Etapa `production`: imagen sin devDependencies y con el codigo compilado.
    build: { context: ./orders-ms, target: production }

    container_name: orders-ms

    restart: unless-stopped

    environment:
      PORT: "3002"
      NATS_SERVERS: "nats://nats:4222"
      DATABASE_URL: "postgresql://postgres:123456@orders-db:5432/ordersdb?schema=public"

    depends_on:
      nats:
        condition: service_healthy
      orders-db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Microservicio de productos (NATS). Persistencia en SQLite.
  # ---------------------------------------------------------------------------
  products-ms:
    build: { context: ./products-ms, target: production }

    container_name: products-ms

    restart: unless-stopped

    environment:
      PORT: "3001"
      NATS_SERVERS: "nats://nats:4222"
      DATABASE_URL: "file:/data/dev.db"

    volumes:
      # Volumen nombrado con el archivo SQLite (/data/dev.db).
      - "products-data:/data"

    depends_on:
      nats:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Gateway HTTP: el unico punto de entrada desde afuera (puerto 3000).
  # ---------------------------------------------------------------------------
  client-gateway:
    build: { context: ./client-gateway, target: production }

    container_name: client-gateway

    restart: unless-stopped

    ports: ["3000:3000"]

    environment:
      PORT: "3000"
      NATS_SERVERS: "nats://nats:4222"

    depends_on:
      nats:
        condition: service_healthy
      orders-ms:
        condition: service_started
      products-ms:
        condition: service_started

# ------------------------------------------------------------------------------
# Volumenes de datos. Se les pone nombre explicito para que este stack
# COMPARTA las bases con el stack de desarrollo (docker-compose.yaml).
# ------------------------------------------------------------------------------
volumes:
  nats-data:
    name: nest-microservices_nats-data
  orders-db-data:
    name: nest-microservices_orders-db-data
  products-data:
    name: nest-microservices_products-data
